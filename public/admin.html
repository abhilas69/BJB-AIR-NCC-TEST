<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Gateway</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loginContainer" class="container">
        <h1>Admin Authentication</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUsername" required placeholder="Enter admin username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" required placeholder="••••">
            </div>
            <button type="submit">Unlock Dashboard</button>
        </form>
    </div>

    <div id="adminPanelContainer" class="container" style="max-width: 800px; display: none;">
        <h1>Admin Control Panel</h1>
        <div class="admin-nav">
            <button id="navAdd" class="active">Add Questions</button>
            <button id="navView">View Results</button>
        </div>

        <div id="addQuestionSection">
            <h2>Create New Question</h2>
            <form id="questionForm">
                <div class="form-group">
                    <label>Question Text</label>
                    <input type="text" id="qText" required>
                </div>
                <div class="form-group">
                    <label>Option 1</label>
                    <input type="text" class="opt" required>
                </div>
                <div class="form-group">
                    <label>Option 2</label>
                    <input type="text" class="opt" required>
                </div>
                <div class="form-group">
                    <label>Option 3</label>
                    <input type="text" class="opt" required>
                </div>
                <div class="form-group">
                    <label>Option 4</label>
                    <input type="text" class="opt" required>
                </div>
                <div class="form-group">
                    <label>Correct Answer Index (0-3)</label>
                    <select id="correctIndex">
                        <option value="0">Option 1</option>
                        <option value="1">Option 2</option>
                        <option value="2">Option 3</option>
                        <option value="3">Option 4</option>
                    </select>
                </div>
                <button type="submit">Save Question to DB</button>
            </form>
        </div>

        <div id="viewResultsSection" style="display: none;">
            <h2>Submitted Student Profiles</h2>
            <div id="userList"></div>
            <div id="userDetails" class="user-details-card" style="display: none;"></div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
